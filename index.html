<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>东南降雨型群发滑坡防御平台</title>
  <base href="./">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css?v=20251021" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v9.2.4/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

  <style>
    :root{
      --bg: #0b1220;
      --panel: rgba(18,22,35,0.72);
      --panel-strong: rgba(18,22,35,0.88);
      --line: rgba(120,160,255,0.32);
      --blue: #7bd0ff;
      --shadow: 0 10px 30px rgba(0,0,0,0.45);
      --blur: blur(10px);
    }
    html, body { height:100%; margin:0; background:var(--bg); color:#e8eefc; overflow:hidden; font-family:'Inter','Microsoft YaHei',sans-serif; }
    #map { position:absolute; inset:0; background: radial-gradient(1200px 800px at 50% 40%, #151b2a, #0b1220); z-index: 1; }
    .map-error {
      position:absolute;
      inset:0;
      z-index: 35;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0 24px;
      background:rgba(11,18,32,0.92);
      color:#ffb74d;
      font-size:15px;
      text-align:center;
      backdrop-filter:blur(6px);
    }

    .header { position:absolute; top:0; left:0; right:0; height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 22px; background:var(--panel-strong); border-bottom:1px solid var(--line); backdrop-filter:var(--blur); box-shadow:var(--shadow); z-index:40;}
    .title { font-size:20px; font-weight:700; color:var(--blue); }
    .time { color:#a7b8d8; font-size:13px; }

    .modules-wrap { position:absolute; left:50%; transform:translateX(-50%); top:66px; width:min(1400px,96vw); display:grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap:12px; z-index:25; padding:8px 6px;}
    .module-card{ height:100px; background:var(--panel); border:1px solid var(--line); border-radius:14px; cursor:pointer; display:grid; place-items:center; text-align:center; transition:transform .25s ease, background .25s ease, border-color .25s ease; backdrop-filter:var(--blur); box-shadow:var(--shadow); position:relative; overflow:hidden; z-index: 26;}
    .module-card:hover{ transform:translateY(-2px); background:rgba(30,38,64,0.85); border-color:rgba(120,180,255,0.6); }
    .module-card:active{ transform:translateY(0); filter:brightness(1.05); }
    .module-icon{ font-size:18px; }
    .icon-blue{ color: var(--blue); } .icon-orange{ color: #ffb74d;} .icon-cyan{ color: #81d4fa;} .icon-teal{ color: #4db6ac;}
    .module-title{ font-size:14px; font-weight:700; margin-top:4px; }
    .module-sub{ font-size:11px; color:#a7bddc; }

    /* 右侧纵向按钮栈（方案A） */
    .right-controls{
      position:absolute; right:16px; top:76px; z-index:38;
      display:flex; flex-direction:column; gap:10px;
    }
    .bm-btn, .layer-fab{
      width:120px; height:32px; border-radius:8px; background:var(--panel);
      border:1px solid var(--line); color:#cfe6ff; font-size:12px; cursor:pointer;
      display:flex; align-items:center; justify-content:center; transition:all .25s ease;
      backdrop-filter:var(--blur); box-shadow:var(--shadow);
    }
    .bm-btn:hover, .layer-fab:hover{ background:rgba(30,38,64,0.85); border-color:rgba(120,180,255,0.6); }
    .bm-btn.active{ background:rgba(60,90,140,0.85); border-color:#7ec7ff; color:#fff; }
    .layer-fab{ height:44px; font-size:16px; }

    /* 面板 */
    .layer-panel{
      position:absolute; right:136px; top:76px; z-index:39; width:220px;
      transform-origin: top right; transform: scale(0.95);
      opacity:0; pointer-events:none;
      background:var(--panel-strong); border:1px solid var(--line); border-radius:12px;
      box-shadow:var(--shadow); backdrop-filter:var(--blur); padding:12px 12px 10px 12px;
      transition: opacity .18s ease, transform .18s ease;
    }
    .layer-panel.open{ opacity:1; transform: scale(1); pointer-events:auto; }
    .layer-panel h4{ margin:0 0 8px 0; font-size:16px; color:#9cd0ff; border-bottom:1px solid var(--line); padding-bottom:6px; }
    .layer-item{ display:flex; align-items:center; gap:10px; color:#cfe6ff; font-size:13px; padding:6px 4px; }
    .layer-item input{ width:18px; height:18px; }

    /* 省界可见性增强（WMS层图像滤镜） */
    .province-wms img{ filter: drop-shadow(0 0 2px #00baff) contrast(1.35) saturate(1.6); }

    .status-bar{ position:absolute; left:0; right:0; bottom:0; height:52px; background:var(--panel-strong); border-top:1px solid var(--line);
      display:flex; align-items:center; justify-content:space-between; padding:0 18px; z-index:30; backdrop-filter:var(--blur); box-shadow:var(--shadow); color:#9db8df; font-size:12px; }
    .status-left{ display:flex; flex-direction:column; gap:6px; }
    .status-metrics{ display:flex; align-items:center; gap:18px; }
    .badge{ display:flex; align-items:center; gap:8px; }
    .dot{ width:10px; height:10px; border-radius:50%; } .blue{ background:#4fa8ff;} .orange{ background:#ff9100;} .green{ background:#00e676; }
    .data-source{ font-size:11px; color:#7fa6ff; display:flex; align-items:center; gap:6px; }
    .data-source .status-online{ color:#9cffd0; font-weight:600; }
    .data-source .status-offline{ color:#ffb74d; font-weight:600; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="header">
    <div class="title">东南降雨型群发滑坡防御软件平台</div>
    <div class="time" id="time"></div>
  </div>

  <div class="modules-wrap" id="modules">
    <div class="module-card" data-module="identification">
      <div class="module-icon icon-blue"><i class="fas fa-crosshairs"></i></div>
      <div class="module-title">精确识别模块</div>
      <div class="module-sub">AI智能识别</div>
    </div>
    <div class="module-card" data-module="warning">
      <div class="module-icon icon-orange"><i class="fas fa-exclamation-triangle"></i></div>
      <div class="module-title">智能预警模块</div>
      <div class="module-sub">多级预警防控</div>
    </div>
    <div class="module-card" data-module="assessment">
      <div class="module-icon icon-cyan"><i class="fas fa-chart-line"></i></div>
      <div class="module-title">综合评估模块</div>
      <div class="module-sub">风险分析评估</div>
    </div>
    <div class="module-card" data-module="control">
      <div class="module-icon icon-teal"><i class="fas fa-shield-alt"></i></div>
      <div class="module-title">韧性防控模块</div>
      <div class="module-sub">防控调度管理</div>
    </div>
  </div>

  <!-- 右侧纵向按钮栈：第一是图层按钮，其下是底图切换 -->
  <div class="right-controls">
    <button class="layer-fab" id="layerFab" title="图层开关"><i class="fas fa-layer-group"></i></button>
    <button class="bm-btn active" data-base="satellite">卫星底图</button>
    <button class="bm-btn" data-base="terrain">地形底图</button>
  </div>

  <!-- 弹出面板 -->
  <div class="layer-panel" id="layerPanel">
    <h4>地图图层</h4>
    <label class="layer-item">
      <input type="checkbox" id="chk-province" checked>
      <span>省界轮廓</span>
    </label>
    <label class="layer-item">
      <input type="checkbox" id="chk-monitor" checked>
      <span>监测点位</span>
    </label>
    <label class="layer-item">
      <input type="checkbox" id="chk-risk">
      <span>风险区域</span>
    </label>
  </div>

  <div class="status-bar">
    <div class="status-left">
      <div>监测区域：福建、浙江、江西、广东重点区域</div>
      <div class="data-source">数据源：<span id="dataSourceLabel" class="status-offline">本地演示数据</span></div>
    </div>
    <div class="status-metrics">
      <div class="badge"><span class="dot blue"></span>监测：<span id="stat-monitoring">1,203</span></div>
      <div class="badge"><span class="dot orange"></span>预警：<span id="stat-warning">3</span></div>
      <div class="badge"><span class="dot green"></span>安全：<span id="stat-safe">152</span></div>
    </div>
  </div>

  <script type="module">
    import {
      fetchMonitoringSites,
      subscribeMonitoringSites,
      fetchRiskAreas,
      subscribeRiskAreas,
      fetchDashboardStats,
      subscribeDashboardStats,
      getCloudStatus
    } from './js/cloud-database.js';

    // -------- OpenLayers 初始化 --------
    let map, baseSatellite, baseTerrain, baseOSM;
    let provinceOutlineWMS;     // 省界（WMS）
    let provinceOutlineVector;  // 省界（可选：GeoJSON/矢量瓦片）
    let monitoringLayer;        // 监测点
    let riskLayer;              // 风险圈
    let unsubscribeMonitoring = null;
    let unsubscribeRiskAreas = null;
    let unsubscribeDashboard = null;

    // === 可在此处配置自己的矢量边界 ===
    // 1) GeoJSON URL（同目录或完整地址，需支持CORS）
    const GEOJSON_URL = ""; // 例如 "./china_provinces.geojson"
    // 2) 矢量瓦片（MVT）URL模板（可选），如 "https://{a-c}.server/tiles/{z}/{x}/{y}.pbf"
    const MVT_URL = ""; // 设置后会优先生效

    let MapCtor, ViewCtor, TileLayerCtor, VectorLayerCtor, ImageLayerCtor, VectorTileLayerCtor;
    let XYZSourceCtor, VectorSourceCtor, ImageWMSSourceCtor, OSMSrcCtor, VectorTileSourceCtor;
    let StyleCtor, FillCtor, StrokeCtor, CircleStyleCtor, TextCtor, FeatureCtor, PointGeomCtor, CircleGeomCtor, GeoJSONFormatCtor, MVTFormatCtor, fromLonLatFn;
    let mapErrorOverlay = null;

    function ensureOpenLayers(){
      if (window.ol) return Promise.resolve(window.ol);
      if (ensureOpenLayers.promise) return ensureOpenLayers.promise;
      ensureOpenLayers.promise = new Promise((resolve, reject) => {
        const scriptId = 'openlayers-script';
        let script = document.getElementById(scriptId);
        const onLoad = () => {
          cleanup();
          if (window.ol) {
            resolve(window.ol);
          } else {
            reject(new Error('OpenLayers 已加载但未找到全局变量。'));
          }
        };
        const onError = () => {
          if (script && script.parentNode){
            script.parentNode.removeChild(script);
            script = null;
          }
          cleanup();
          reject(new Error('无法加载 OpenLayers 库。'));
        };
        const cleanup = () => {
          if (script) {
            script.removeEventListener('load', onLoad);
            script.removeEventListener('error', onError);
          }
        };
        if (!script) {
          script = document.createElement('script');
          script.id = scriptId;
          script.src = 'https://cdn.jsdelivr.net/npm/ol@v9.2.4/dist/ol.js';
          script.async = true;
          script.crossOrigin = 'anonymous';
          script.addEventListener('load', onLoad);
          script.addEventListener('error', onError);
          document.head.appendChild(script);
        } else {
          script.addEventListener('load', onLoad);
          script.addEventListener('error', onError);
        }
        if (window.ol) {
          cleanup();
          resolve(window.ol);
        }
      }).catch(error => {
        ensureOpenLayers.promise = null;
        throw error;
      });
      return ensureOpenLayers.promise;
    }

    function showMapError(message){
      if (!mapErrorOverlay){
        mapErrorOverlay = document.createElement('div');
        mapErrorOverlay.className = 'map-error';
        document.body.appendChild(mapErrorOverlay);
      }
      mapErrorOverlay.textContent = message;
    }

    function clearMapError(){
      if (mapErrorOverlay){
        mapErrorOverlay.remove();
        mapErrorOverlay = null;
      }
    }

    async function initMap(){
      const ol = await ensureOpenLayers();
      if (!ol) throw new Error('OpenLayers 未就绪');

      MapCtor = ol.Map;
      ViewCtor = ol.View;
      TileLayerCtor = ol.layer.Tile;
      VectorLayerCtor = ol.layer.Vector;
      ImageLayerCtor = ol.layer.Image;
      VectorTileLayerCtor = ol.layer.VectorTile;
      XYZSourceCtor = ol.source.XYZ;
      VectorSourceCtor = ol.source.Vector;
      ImageWMSSourceCtor = ol.source.ImageWMS;
      OSMSrcCtor = ol.source.OSM;
      VectorTileSourceCtor = ol.source.VectorTile;
      StyleCtor = ol.style.Style;
      FillCtor = ol.style.Fill;
      StrokeCtor = ol.style.Stroke;
      CircleStyleCtor = ol.style.Circle;
      TextCtor = ol.style.Text;
      FeatureCtor = ol.Feature;
      PointGeomCtor = ol.geom.Point;
      CircleGeomCtor = ol.geom.Circle;
      GeoJSONFormatCtor = ol.format?.GeoJSON;
      MVTFormatCtor = ol.format?.MVT;
      fromLonLatFn = ol.proj.fromLonLat;

      baseSatellite = new TileLayerCtor({ source: new XYZSourceCtor({ url:'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', crossOrigin:'anonymous' }), visible:true }); baseSatellite.setZIndex(0);
      baseTerrain   = new TileLayerCtor({ source: new XYZSourceCtor({ url:'https://services.arcgisonline.com/ArcGIS/rest/services/World_Terrain_Base/MapServer/tile/{z}/{y}/{x}', crossOrigin:'anonymous' }), visible:false }); baseTerrain.setZIndex(0);
      baseOSM       = new TileLayerCtor({ source: new OSMSrcCtor({crossOrigin:'anonymous'}), visible:false }); baseOSM.setZIndex(0);

      // 省界（默认：WMS；若配置了MVT或GeoJSON则叠加/替换）
      provinceOutlineWMS = new ImageLayerCtor({
        className: 'province-wms',
        source: new ImageWMSSourceCtor({
          url: 'https://ahocevar.com/geoserver/wms',
          params: { 'LAYERS': 'ne:ne_10m_admin_1_states_provinces_lines_shp', 'TILED': true, 'TRANSPARENT': true },
          ratio: 1, crossOrigin:'anonymous'
        }),
        opacity: 1, visible: true
      }); provinceOutlineWMS.setZIndex(10);

      riskLayer = new VectorLayerCtor({
        source: new VectorSourceCtor(),
        style: new StyleCtor({ fill: new FillCtor({color: 'rgba(255,100,100,0.18)'}), stroke: new StrokeCtor({color: '#ff5252', width: 2}) }),
        visible: false
      }); riskLayer.setZIndex(20);

      monitoringLayer = new VectorLayerCtor({
        source: new VectorSourceCtor(),
        style: f => new StyleCtor({
          image: new CircleStyleCtor({ radius: 7, fill: new FillCtor({color: '#4fc3f7'}), stroke: new StrokeCtor({color:'#0b1220', width: 2}) }),
          text: new TextCtor({ text: f.get('name') || '', font: '12px "Microsoft YaHei", Inter, sans-serif', fill: new FillCtor({color:'#ffffff'}), stroke: new StrokeCtor({color:'#0b1220', width: 3}), offsetY: -16 })
        }),
        visible: true
      }); monitoringLayer.setZIndex(30);

      const view = new ViewCtor({ center: fromLonLatFn([119.5,26.8]), zoom: 7 });
      map = new MapCtor({ target:'map', layers:[baseSatellite, baseTerrain, baseOSM, provinceOutlineWMS, riskLayer, monitoringLayer], view });
      setTimeout(()=> map.updateSize(), 80);

      loadMonitoringPoints();
      loadRiskAreas();
      loadDashboardStats();
      setupOptionalVectorBoundary(); // 如果你配置了 GEOJSON_URL 或 MVT_URL，这里会加载
      bindUI();
      guardTiles();
      clearMapError();
    }

    function setupOptionalVectorBoundary(){
      // 若配置了矢量瓦片（MVT），优先生效
      if (MVT_URL && VectorTileLayerCtor && VectorTileSourceCtor && MVTFormatCtor){
        provinceOutlineVector = new VectorTileLayerCtor({
          source: new VectorTileSourceCtor({
            format: new MVTFormatCtor(),
            url: MVT_URL,
            maxZoom: 14
          }),
          style: new StyleCtor({
            stroke: new StrokeCtor({ color: '#00baff', width: 2 })
          }),
          visible: true
        });
        provinceOutlineVector.setZIndex(11);
        map.addLayer(provinceOutlineVector);
      } else if (GEOJSON_URL && GeoJSONFormatCtor){
        // GeoJSON 边界
        provinceOutlineVector = new VectorLayerCtor({
          source: new VectorSourceCtor({
            url: GEOJSON_URL,
            format: new GeoJSONFormatCtor()
          }),
          style: new StyleCtor({
            stroke: new StrokeCtor({ color: '#00baff', width: 2 })
          }),
          visible: true
        });
        provinceOutlineVector.setZIndex(11);
        map.addLayer(provinceOutlineVector);
      }
    }

    function renderMonitoringPoints(points = []){
      if (!monitoringLayer || !FeatureCtor || !PointGeomCtor || !fromLonLatFn) return;
      const src = monitoringLayer.getSource();
      src.clear();
      points
        .filter(p => typeof p.lon === 'number' && typeof p.lat === 'number')
        .forEach((p) => {
          const feature = new FeatureCtor({
            geometry: new PointGeomCtor(fromLonLatFn([p.lon, p.lat])),
            name: p.name || '监测点'
          });
          src.addFeature(feature);
        });
    }

    async function loadMonitoringPoints(){
      const points = await fetchMonitoringSites();
      renderMonitoringPoints(points);
      updateCloudStatusIndicator();
      if (typeof unsubscribeMonitoring === 'function') unsubscribeMonitoring();
      unsubscribeMonitoring = subscribeMonitoringSites((items) => {
        renderMonitoringPoints(items);
        updateCloudStatusIndicator();
      });
    }

    function renderRiskAreas(areas = []){
      if (!riskLayer || !FeatureCtor || !CircleGeomCtor || !fromLonLatFn) return;
      const src = riskLayer.getSource();
      src.clear();
      areas
        .filter(a => typeof a.lon === 'number' && typeof a.lat === 'number')
        .forEach((area) => {
          const radius = Number(area.radius) > 0 ? Number(area.radius) : 1000;
          const circle = new CircleGeomCtor(fromLonLatFn([area.lon, area.lat]), radius);
          const feature = new FeatureCtor({ geometry: circle, name: area.name || '风险区域' });
          src.addFeature(feature);
        });
    }

    async function loadRiskAreas(){
      const areas = await fetchRiskAreas();
      renderRiskAreas(areas);
      updateCloudStatusIndicator();
      if (typeof unsubscribeRiskAreas === 'function') unsubscribeRiskAreas();
      unsubscribeRiskAreas = subscribeRiskAreas((items) => {
        renderRiskAreas(items);
        updateCloudStatusIndicator();
      });
    }

    function updateStatusBar(stats = {}){
      const monitoring = document.getElementById('stat-monitoring');
      const warning = document.getElementById('stat-warning');
      const safe = document.getElementById('stat-safe');
      if (monitoring) monitoring.textContent = formatNumber(stats.monitoring ?? stats.monitoringCount ?? 0);
      if (warning) warning.textContent = formatNumber(stats.warning ?? stats.warningCount ?? 0);
      if (safe) safe.textContent = formatNumber(stats.safe ?? stats.safeCount ?? 0);
    }

    function formatNumber(value){
      const num = Number(value);
      if (Number.isFinite(num)) return num.toLocaleString('zh-CN');
      return value || '-';
    }

    async function loadDashboardStats(){
      const stats = await fetchDashboardStats();
      updateStatusBar(stats);
      updateCloudStatusIndicator();
      if (typeof unsubscribeDashboard === 'function') unsubscribeDashboard();
      unsubscribeDashboard = subscribeDashboardStats((current) => {
        updateStatusBar(current);
        updateCloudStatusIndicator();
      });
    }

    function updateCloudStatusIndicator(){
      const label = document.getElementById('dataSourceLabel');
      if (!label) return;
      const status = getCloudStatus();
      label.classList.remove('status-online', 'status-offline');
      if (!status.configured){
        label.textContent = '本地演示数据（未配置云数据库）';
        label.classList.add('status-offline');
      } else if (status.usingFallback){
        label.textContent = '演示数据（云数据库暂不可用）';
        label.classList.add('status-offline');
      } else {
        label.textContent = '云数据库实时数据';
        label.classList.add('status-online');
      }
    }

    function bindUI(){
      // 图层按钮：开/关面板
      const fab = document.getElementById('layerFab');
      const panel = document.getElementById('layerPanel');
      fab.addEventListener('click', ()=>{ panel.classList.toggle('open'); });

      // 面板开关
      document.getElementById('chk-province').addEventListener('change', (e)=>{
        provinceOutlineWMS.setVisible(e.target.checked);
        if (provinceOutlineVector) provinceOutlineVector.setVisible(e.target.checked);
      });
      document.getElementById('chk-monitor').addEventListener('change', (e)=> monitoringLayer.setVisible(e.target.checked));
      document.getElementById('chk-risk').addEventListener('change', (e)=> riskLayer.setVisible(e.target.checked));

      // 底图切换
      document.querySelectorAll('.bm-btn').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          document.querySelectorAll('.bm-btn').forEach(b=>b.classList.remove('active'));
          btn.classList.add('active');
          const isSat = btn.dataset.base === 'satellite';
          baseSatellite.setVisible(isSat);
          baseTerrain.setVisible(!isSat);
          if(!baseSatellite.getVisible() && !baseTerrain.getVisible()){ baseOSM.setVisible(true); }
        });
      });

      // 模块跳转
      const routes = { identification: 'identification.html', warning: 'warning.html', assessment: 'assessment.html', control: 'control.html' };
      document.querySelectorAll('.module-card').forEach(card=>{
        card.addEventListener('click', ()=>{ const url = routes[card.dataset.module]; if(url) window.location.href = url; });
      });
    }

    function guardTiles(){
      let satErr = 0, terrErr = 0;
      baseSatellite.getSource().on('tileloaderror', ()=>{ satErr++; if(satErr>=3){ baseSatellite.setVisible(false); baseOSM.setVisible(true);} });
      baseTerrain.getSource().on('tileloaderror', ()=>{ terrErr++; if(terrErr>=3){ baseTerrain.setVisible(false); baseOSM.setVisible(true);} });
    }

    function tickTime(){ document.getElementById('time').textContent = new Date().toLocaleString('zh-CN',{hour12:false}); }
    setInterval(tickTime,1000);
    document.addEventListener('DOMContentLoaded', ()=>{
      updateCloudStatusIndicator();
      tickTime();
      initMap().catch((error)=>{
        console.error('地图初始化失败', error);
        showMapError('地图底图加载失败，请检查网络或稍后重试。');
      });
    });
  </script>
</body>
</html>
