<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能预警模块 - 东南地区滑坡防御平台</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@300;400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-bg: #0a0e1a;
            --secondary-bg: #1a1f2e;
            --accent-bg: #252b3d;
            --card-bg: rgba(26, 31, 46, 0.9);
            --border-color: #2d3748;
            --primary-blue: #00d4ff;
            --secondary-blue: #0099cc;
            --accent-cyan: #00ff88;
            --warning-orange: #ff6b35;
            --danger-red: #ff4757;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --text-muted: #718096;
            --glow-blue: 0 0 20px rgba(0, 212, 255, 0.5);
            --glow-cyan: 0 0 20px rgba(0, 255, 136, 0.5);
            --glow-orange: 0 0 20px rgba(255, 107, 53, 0.5);
            --glow-red: 0 0 20px rgba(255, 71, 87, 0.5);
        }

        body {
            font-family: 'Rajdhani', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1f2e 50%, #252b3d 100%);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* 科技感背景 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 107, 53, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 107, 53, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            z-index: -1;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* 顶部导航 */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .back-btn {
            background: linear-gradient(135deg, var(--warning-orange), #ee5a52);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--glow-orange);
        }

        .module-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--warning-orange);
            text-shadow: var(--glow-orange);
        }

        .status-info {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 14px;
        }

        .data-source-chip {
            padding: 4px 12px;
            border-radius: 14px;
            background: rgba(0, 212, 255, 0.15);
            border: 1px solid rgba(0, 212, 255, 0.4);
            color: var(--primary-blue);
            font-size: 12px;
        }

        .data-source-chip.offline {
            background: rgba(255, 107, 53, 0.15);
            border-color: rgba(255, 107, 53, 0.4);
            color: var(--warning-orange);
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--warning-orange);
            box-shadow: var(--glow-orange);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }

        /* 预警概览面板 */
        .warning-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .warning-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .warning-card.high-risk {
            border-left: 4px solid var(--danger-red);
        }

        .warning-card.medium-risk {
            border-left: 4px solid var(--warning-orange);
        }

        .warning-card.low-risk {
            border-left: 4px solid var(--accent-cyan);
        }

        .warning-icon {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .warning-value {
            font-size: 32px;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
            margin-bottom: 5px;
        }

        .warning-card.high-risk .warning-value {
            color: var(--danger-red);
            text-shadow: var(--glow-red);
        }

        .warning-card.medium-risk .warning-value {
            color: var(--warning-orange);
            text-shadow: var(--glow-orange);
        }

        .warning-card.low-risk .warning-value {
            color: var(--accent-cyan);
            text-shadow: var(--glow-cyan);
        }

        .warning-label {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* 主要内容区域 */
        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        /* 预警列表 */
        .warning-list-section {
            background: var(--card-bg);
            border-radius: 15px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .section-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--warning-orange);
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
        }

        .filter-btn {
            padding: 6px 12px;
            background: rgba(45, 55, 72, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background: var(--warning-orange);
            border-color: var(--warning-orange);
            color: white;
            box-shadow: var(--glow-orange);
        }

        .warning-list {
            max-height: 500px;
            overflow-y: auto;
            padding: 20px;
        }

        .warning-empty {
            padding: 20px;
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            background: rgba(45, 55, 72, 0.2);
            color: var(--text-secondary);
            text-align: center;
        }

        .warning-item {
            padding: 15px;
            margin-bottom: 15px;
            background: rgba(45, 55, 72, 0.3);
            border-radius: 10px;
            border-left: 4px solid var(--warning-orange);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .warning-item:hover {
            background: rgba(255, 107, 53, 0.1);
            transform: translateX(5px);
        }

        .warning-item.high {
            border-left-color: var(--danger-red);
        }

        .warning-item.medium {
            border-left-color: var(--warning-orange);
        }

        .warning-item.low {
            border-left-color: var(--accent-cyan);
        }

        .warning-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .warning-id {
            font-weight: 600;
            color: var(--text-primary);
        }

        .warning-level {
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }

        .level-high {
            background: rgba(255, 71, 87, 0.2);
            color: var(--danger-red);
        }

        .level-medium {
            background: rgba(255, 107, 53, 0.2);
            color: var(--warning-orange);
        }

        .level-low {
            background: rgba(0, 255, 136, 0.2);
            color: var(--accent-cyan);
        }

        .warning-info {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .warning-time {
            font-size: 11px;
            color: var(--text-muted);
            font-family: 'Orbitron', monospace;
        }

        /* 侧边栏 */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .info-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--warning-orange);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 气象数据 */
        .weather-data {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .weather-item {
            text-align: center;
            padding: 15px;
            background: rgba(45, 55, 72, 0.3);
            border-radius: 10px;
        }

        .weather-value {
            font-size: 20px;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
            color: var(--accent-cyan);
            margin-bottom: 5px;
        }

        .weather-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* 预警设置 */
        .warning-settings {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .setting-item:last-child {
            border-bottom: none;
        }

        .setting-label {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .setting-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toggle-switch {
            width: 40px;
            height: 20px;
            background: rgba(45, 55, 72, 0.6);
            border-radius: 10px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toggle-switch.active {
            background: var(--warning-orange);
            box-shadow: var(--glow-orange);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            background: white;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .toggle-switch.active::after {
            transform: translateX(20px);
        }

        .threshold-input {
            width: 60px;
            padding: 5px;
            background: rgba(45, 55, 72, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            color: var(--text-primary);
            font-size: 12px;
        }

        /* 响应式设计 */
        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .warning-overview {
                grid-template-columns: 1fr;
            }
            
            .filter-buttons {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>

        <nav class="top-nav">

    <script type="module">
        import {
            fetchWarningEvents,
            subscribeWarningEvents,
            fetchWarningStats,
            subscribeWarningStats,
            getCloudStatus
        } from './js/cloud-database.js';

        let currentFilter = 'all';
        let unsubscribeWarnings = null;
        let unsubscribeStats = null;

        function setupFilters() {
            document.querySelectorAll('.filter-btn').forEach(button => {
                button.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    applyFilter(button.dataset.filter || 'all');
                });
            });
        }

        function applyFilter(level) {
            currentFilter = level;
            const list = document.getElementById('warningList');
            if (!list) return;
            const items = Array.from(list.querySelectorAll('.warning-item'));
            const placeholder = list.querySelector('.warning-empty[data-role="filter"]');

            if (!items.length) {
                if (placeholder) {
                    placeholder.style.display = 'block';
                }
                return;
            }

            let visibleCount = 0;
            items.forEach(item => {
                const matches = level === 'all' || item.dataset.level === level;
                item.style.display = matches ? '' : 'none';
                if (matches) visibleCount++;
            });

            if (placeholder) {
                placeholder.style.display = visibleCount === 0 ? 'block' : 'none';
            }
        }

        function renderWarningStats(stats = {}) {
            document.querySelectorAll('[data-warning-stat]').forEach(node => {
                const key = node.dataset.warningStat;
                const value = stats?.[key];
                if (key === 'timelyRate') {
                    const numeric = Number(value);
                    node.textContent = Number.isFinite(numeric) ? `${numeric.toFixed(1)}%` : (value ?? '--');
                } else {
                    const numeric = Number(value);
                    node.textContent = Number.isFinite(numeric) ? numeric.toLocaleString('zh-CN') : (value ?? '0');
                }
            });
        }

        function renderWarnings(warnings = []) {
            const list = document.getElementById('warningList');
            if (!list) return;
            list.innerHTML = '';
            if (!warnings.length) {
                list.appendChild(createEmptyElement('当前没有活跃预警事件。'));
                return;
            }

            warnings.forEach(warning => {
                list.appendChild(createWarningItem(warning));
            });

            const placeholder = createEmptyElement('当前筛选条件下没有活跃预警。');
            placeholder.dataset.role = 'filter';
            placeholder.style.display = 'none';
            list.appendChild(placeholder);

            applyFilter(currentFilter);
        }

        function createWarningItem(warning) {
            const level = (warning.level || 'low').toLowerCase();
            const item = document.createElement('div');
            item.className = `warning-item ${level}`;
            item.dataset.level = level;

            const header = document.createElement('div');
            header.className = 'warning-header';

            const idSpan = document.createElement('span');
            idSpan.className = 'warning-id';
            const title = warning.title || '未命名预警';
            const idLabel = warning.id ? `${warning.id} - ${title}` : title;
            idSpan.textContent = idLabel;

            const levelSpan = document.createElement('span');
            levelSpan.className = `warning-level level-${level}`;
            levelSpan.textContent = levelLabel(level);

            header.appendChild(idSpan);
            header.appendChild(levelSpan);

            const info = document.createElement('div');
            info.className = 'warning-info';
            info.textContent = formatMetrics(warning);

            const time = document.createElement('div');
            time.className = 'warning-time';
            time.textContent = formatIssuedAt(warning.issuedAt);

            item.appendChild(header);
            item.appendChild(info);
            item.appendChild(time);

            item.addEventListener('click', () => showWarningDetail(warning));

            return item;
        }

        function levelLabel(level) {
            switch (level) {
                case 'high':
                    return '高风险';
                case 'medium':
                    return '中风险';
                case 'low':
                    return '低风险';
                default:
                    return level || '未知';
            }
        }

        function formatMetrics(warning) {
            const segments = [];
            if (warning.rainfall !== undefined && warning.rainfall !== null) {
                segments.push(`降雨量: ${warning.rainfall}mm/24h`);
            }
            if (warning.soilMoisture !== undefined && warning.soilMoisture !== null) {
                segments.push(`土壤含水率: ${warning.soilMoisture}%`);
            }
            if (warning.slope !== undefined && warning.slope !== null) {
                segments.push(`坡度: ${warning.slope}°`);
            }
            if (warning.area) {
                segments.push(`区域: ${warning.area}`);
            }
            return segments.join(' | ') || '暂无详细指标';
        }

        function formatIssuedAt(value) {
            if (!value) return '时间未知';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return value;
            return date.toLocaleString('zh-CN', { hour12: false });
        }

        function showWarningDetail(warning) {
            const details = [
                `预警编号：${warning.id || '未知'}`,
                `预警名称：${warning.title || '未命名预警'}`,
                `风险等级：${levelLabel((warning.level || '').toLowerCase())}`,
                `覆盖区域：${warning.area || '未提供'}`,
                `发布时间：${formatIssuedAt(warning.issuedAt)}`
            ];

            const metrics = [];
            if (warning.rainfall !== undefined && warning.rainfall !== null) {
                metrics.push(`降雨量 ${warning.rainfall}mm/24h`);
            }
            if (warning.soilMoisture !== undefined && warning.soilMoisture !== null) {
                metrics.push(`土壤含水率 ${warning.soilMoisture}%`);
            }
            if (warning.slope !== undefined && warning.slope !== null) {
                metrics.push(`坡度 ${warning.slope}°`);
            }
            if (metrics.length) {
                details.push('', metrics.join(' | '));
            }
            if (warning.description) {
                details.push('', warning.description);
            }
            alert(details.join('\n'));
        }

        function createEmptyElement(message) {
            const empty = document.createElement('div');
            empty.className = 'warning-empty';
            empty.textContent = message;
            return empty;
        }

        function attachToggleSwitches() {
            document.querySelectorAll('.toggle-switch').forEach(toggle => {
                toggle.addEventListener('click', () => toggle.classList.toggle('active'));
            });
        }

        function updateCloudStatusBadge() {
            const badge = document.getElementById('warningDataSource');
            if (!badge) return;
            badge.classList.remove('offline');
            const status = getCloudStatus();
            if (!status.configured) {
                badge.textContent = '数据源：本地演示（待配置）';
                badge.classList.add('offline');
            } else if (status.usingFallback) {
                badge.textContent = '数据源：演示数据（云端不可用）';
                badge.classList.add('offline');
            } else {
                badge.textContent = '数据源：云数据库实时';
            }
        }

        async function loadWarningStats() {
            const stats = await fetchWarningStats();
            renderWarningStats(stats);
            updateCloudStatusBadge();
            if (typeof unsubscribeStats === 'function') unsubscribeStats();
            unsubscribeStats = subscribeWarningStats(latest => {
                renderWarningStats(latest);
                updateCloudStatusBadge();
            });
        }

        async function loadWarningEvents() {
            const events = await fetchWarningEvents();
            renderWarnings(events);
            updateCloudStatusBadge();
            if (typeof unsubscribeWarnings === 'function') unsubscribeWarnings();
            unsubscribeWarnings = subscribeWarningEvents(latest => {
                renderWarnings(latest);
                updateCloudStatusBadge();
            });
        }

        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleString('zh-CN', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            const node = document.getElementById('currentTime');
            if (node) node.textContent = timeString;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            updateTime();
            setInterval(updateTime, 1000);
            setupFilters();
            attachToggleSwitches();
            updateCloudStatusBadge();
            await Promise.all([loadWarningStats(), loadWarningEvents()]);
        });
    </script>
</body>
</html>
